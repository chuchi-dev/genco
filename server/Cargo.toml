[package]
name = "genco"
version = "0.1.0"
edition = "2024"
description = "A hosting panel for a single Debian server with a maintenance agent"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chuchi-dev/genco"

[dependencies]
axum = { version = "0.8.4", features = ["macros"] }
bcrypt = "0.17"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
craft-dbstrip = "0.1"
futures = "0.3.31"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "hostname"] }
mime_guess = "2"
rand = "0.9.2"
reqwest = { version = "0.13", features = ["json", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = "8"
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
soe-llms = "0.0.16"
subtle = "2"
thiserror = "2.0"
tokio = { version = "1.45", features = [
	"rt-multi-thread",
	"fs",
	"io-util",
	"io-std",
	"macros",
	"process",
	"signal",
	"sync",
	"time",
] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
totp-rs = { version = "5", features = ["qr", "gen_secret", "otpauth"] }
tower-http = { version = "0.6.6", features = ["trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
